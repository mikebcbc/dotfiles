---
- defaults:
    link:
      create: true
      force: true
      relink: true
    shell:
      stderr: true
      stdout: true
- shell:
  - ['mkdir -p "$HOME/Pictures/Wallpapers" && cp -n "wallpapers/Dueling Planets.jpg" "$HOME/Pictures/Wallpapers/"', Install wallpaper]
- create:
  - ~/projects
  - ~/.config
  - ~/.config/git
- clean:
  - '~'
- shell:
  - ['[ -L "$HOME/.config/ghostty" ] && rm "$HOME/.config/ghostty" || true', Migrate ghostty dir link]
- link:
    ~/.config/fish: fish
    ~/.config/nvim: nvim
    ~/.config/ghostty/themes: ghostty/themes
    ~/.config/ghostty/config: ghostty/config
    ~/.config/git/config: git/config
    ~/.config/fastfetch: fastfetch
    ~/.config/noctalia/config.toml: noctalia/config.toml
