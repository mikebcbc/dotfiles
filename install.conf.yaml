---
- defaults:
    link:
      create: true
      force: true
      relink: true
    shell:
      stderr: true
      stdout: true
- create:
  - ~/projects
  - ~/.config
  - ~/.config/git
- clean:
  - '~'
- link:
    ~/.config/fish: fish
    ~/.config/nvim: nvim
    ~/.config/ghostty/themes: ghostty/themes
    ~/.config/ghostty/config: ghostty/config
    ~/.config/git/config: git/config
    ~/.config/fastfetch: fastfetch
