---
- defaults:
    link:
      create: true
      force: true
      relink: true
    shell:
      stderr: true
      stdout: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
- create:
  - ~/projects
  - ~/.config
  - ~/.config/git
- clean:
  - '~'
- link:
  ~/.config/fish: fish
  ~/.config/nvim: nvim
  ~/.config/ghostty: ghostty
  ~/.config/git/config: git/config
  ~/.config/fastfetch: fastfetch
- shell:
  - [scripts/install-packages.sh, Installing OS-specific packages]