---
- defaults:
    link:
      create: true
      force: true
      relink: true
    shell:
      stderr: true
      stdout: true
- shell:
  - [git submodule update --init --recursive, Installing submodules]
- create:
  - ~/projects
  - ~/.config
  - ~/.config/git
- clean:
  - '~'
- shell:
  - ['[ -L "$HOME/.config/ghostty" ] && rm "$HOME/.config/ghostty" || true', Migrate ghostty dir link]
- link:
    ~/.config/fish: fish
    ~/.config/nvim: nvim
    ~/.config/ghostty/themes: ghostty/themes
    ~/.config/ghostty/config: ghostty/config
    ~/.config/git/config: git/config
    ~/.config/fastfetch: fastfetch
- shell:
  - [scripts/install-packages.sh, Installing OS-specific packages]
