# RNNoise mic filter — kills keyboard/typing and other background noise.
# Creates a virtual source named "Noise-Cancelled Webcam"; pick that in apps
# (or set it as the system default). Echo-cancel alone cannot do this.
#
# Requires: ~/.local/lib/ladspa/librnnoise_ladspa.so
#   (scripts/install-rnnoise-ladspa.sh)

context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            node.description = "Noise-Cancelled Webcam"
            media.name       = "Noise-Cancelled Webcam"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        # Absolute path so LADSPA_PATH is not required.
                        plugin = "/home/mikec/.local/lib/ladspa/librnnoise_ladspa.so"
                        label  = noise_suppressor_stereo
                        control = {
                            # Higher = only pass audio when speech is detected
                            # (helps typing). Lower if your voice gets cut off.
                            "VAD Threshold (%)" 65.0
                            "VAD Grace Period (ms)" 200
                            "Retroactive VAD Grace (ms)" 0
                        }
                    }
                ]
            }
            audio.position = [ FL FR ]
            capture.props = {
                node.name = "effect_input.rnnoise"
                node.passive = true
                # Prefer the webcam mic (not buds). Omit dont-reconnect so the
                # filter can appear once the webcam shows up after PipeWire starts.
                target.object = "alsa_input.usb-046d_Logitech_Webcam_C925e_913A4BBF-02.analog-stereo"
            }
            playback.props = {
                node.name = "effect_output.rnnoise"
                media.class = Audio/Source
                # Prefer this over the raw webcam mic when apps ask for default.
                priority.session = 1000
            }
        }
    }
]
