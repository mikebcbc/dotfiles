# Fast prompt profile. Measured in cthulhu (~364k commits): stock git_status alone
# was ~270ms per prompt. Keep git_branch (cheap); drop status/docker/languages.
palette = "catppuccin_macchiato"
command_timeout = 200
scan_timeout = 10

[directory]
truncation_length = 3
truncate_to_repo = true
fish_style_pwd_dir_length = 1
read_only = " 󰌾"

[git_branch]
symbol = " "

# Empty `untracked` / `renamed` still walks the index in huge repos — disable entirely.
[git_status]
disabled = true

[git_metrics]
disabled = true

[git_commit]
disabled = true

[docker_context]
disabled = true

[package]
disabled = true

[battery]
disabled = true

[memory_usage]
disabled = true

# Language / toolchain modules: each does filesystem probes. Off by default for speed.
[aws]
disabled = true
[azure]
disabled = true
